<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Songs Of Praise In Time Of Wars</title>
    
    <!-- Inline PWA Configuration Data URL -->
    <link rel="manifest" href="data:application/manifest+json,{%22short_name%22:%22SongsOfPraise%22,%22name%22:%22Songs%20Of%20Praise%20In%20Time%20Of%20Wars%22,%22start_url%22:%22.%22,%22background_color%22:%22%23070a12%22,%22theme_color%22:%22%23070a12%22,%22display%22:%22standalone%22,%22orientation%22:%22portrait%22}">
    <meta name="theme-color" content="#070a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Premium Global Typography & Sound Frameworks -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://stripe.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --bg-deep: #070a12;
            --card-glass: rgba(255, 255, 255, 0.02);
            --border-glass: rgba(255, 255, 255, 0.07);
            --accent-gold: #dfb44c;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-light: #f9fafb;
            --text-dim: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-shell {
            width: 100%;
            max-width: 420px;
            background: radial-gradient(circle at top right, #111a2e, #070a12);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        header p {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .mission-banner {
            background: linear-gradient(135deg, rgba(223,180,76,0.08), rgba(16,185,129,0.03));
            border: 1px solid rgba(223,180,76,0.15);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 24px;
            font-size: 0.8rem;
            line-height: 1.4;
            text-align: center;
        }
        .mission-banner strong { color: var(--accent-gold); }

        .checkout-box {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
        }
        .price-display {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }
        .price-details {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 16px;
        }
        .action-button {
            width: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #b89136);
            color: #070a12;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .action-button:active { transform: scale(0.98); }

        .video-viewport {
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
            border: 1px solid var(--border-glass);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cinema-loop {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            pointer-events: none;
        }
        .viewport-controls {
            position: relative;
            z-index: 5;
        }

        /* Modern Custom Integrated Audio Player Interface */
        .audio-player-hub {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .player-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .track-info h5 { font-size: 0.85rem; font-weight: 600; color: #fff; }
        .track-info p { font-size: 0.7rem; color: var(--text-dim); }
        
        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .time-label { font-size: 0.65rem; color: var(--text-dim); width: 30px; }
        .progress-bar-bg {
            flex-grow: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .progress-bar-fill {
            width: 35%; /* Preview positioning */
            height: 100%;
            background: var(--accent-gold);
            border-radius: 2px;
            position: absolute;
            top: 0;
            left: 0;
        }
        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.1rem;
            cursor: pointer;
        }
        .icon-btn.primary {
            background: var(--text-light);
            color: var(--bg-deep);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .live-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .live-grid::-webkit-scrollbar { width: 3px; }
        .live-grid::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 2px; }

        .vocal-row {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .vocal-meta { display: flex; align-items: center; gap: 12px; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.completed { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .status-dot.active { background-color: var(--accent-yellow); box-shadow: 0 0 14px var(--accent-yellow); animation: beacon 2s infinite; }
        .status-dot.waiting { background-color: #374151; }
        
        .vocal-text h4 { font-size: 0.85rem; font-weight: 600; letter-spacing: -0.2px; }
        .vocal-text p { font-size: 0.7rem; color: var(--text-dim); margin-top: 1px; }
        .status-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .status-label.active { color: var(--accent-yellow); }
        .status-label.waiting { color: var(--text-dim); }

        @keyframes beacon {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <h1>Songs Of Praise</h1>
        <p>In Time Of Wars</p>
    </header>

    <div class="mission-banner">
        🌍 <strong>Global Strategic Impact:</strong> 100% of non-hosting infrastructure deployment proceeds are directly assigned to establishing and preserving communal health and safety charities overseas.
    </div>

    <div class="checkout-box">
        <div class="price-display">$1,250</div>
        <div class="price-details">Enterprise Structural Acquisition + $100/mo Cloud Node Maintenance</div>
